name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (syntax errors and undefined names)
        run: pip install ruff==0.6.9 && ruff check --select E9,F63,F7,F82 src tests deploy scripts/*.py
      - name: Run tests
        run: pytest -q
